<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
      <div id="main">

       <section class="allElems">
         <div class="todo elem" id="0">
            <img src="https://plus.unsplash.com/premium_photo-1779751087423-5f6ddd767103?q=80&w=471&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
            <h2>Todo List</h2>
         </div>
         <div class="daily elem" id="1">
            <img src="https://images.unsplash.com/photo-1780548006213-b8578f09f2c7?q=80&w=580&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
           <h2>Daily Tasks</h2>
         </div>
         <div class="moti elem" id="2">
            <img src="https://images.unsplash.com/photo-1778274719521-4a8f6a608ff3?q=80&w=1502&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
           <h2>Motivation</h2>
         </div>
         <div class="promo elem" id="3">
            <img src="https://images.unsplash.com/photo-1647802444137-d6b8ebade330?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
            <h2>Promotions</h2>
         </div>
         <div class="goals elem" id="4">
            <img src="https://images.unsplash.com/photo-1780269579991-79bc18ee6f56?q=80&w=464&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
            <h2>Goals</h2>
         </div>

       </section>
       <section class="fullElem toto-list-fullpage">
          <button class="back" id="0">Close</button>
          <h2>Your Personal Task List</h2>
           <div class="todo-container">
            <div class="addTask">
                <form>
                    <input type="text" id="task-input" placeholder="Add a task" >
                    <textarea name="" id="" cols="30" rows="10" placeholder="Add Details"></textarea>
                    <div class="mark-imp">
                        <input type="checkbox" name="" id="check">
                        <label for="check">Mark as Important</label>
                    </div>
                    <button>Add Task</button>
                </form>
            </div>
            <div class="allTask">
                <div class="task">
                    <h5>Gym Time</h5>
                    <button>Mark As Complete</button>
                </div>
                 <div class="task">
                    <h5>Gym Time</h5>
                    <button>Mark As Complete</button>
                </div>
            </div>
            
           </div>
       </section>
       <section class="fullElem daily-planer-fullpage">
          <button class="back" id="1">Close</button>
          <h1>Daily Tasks</h1>
       </section>
       <section class="fullElem motivation-fullpage">
          <button class="back" id="2">Close</button>
          <h1>Motivation</h1>
       </section>
       <section class="fullElem promotions-fullpage">
          <button class="back" id="3">Close</button>
          <h1>Promotions</h1>
       </section>
       <section class="fullElem goals-fullpage">
          <button class="back" id="4">Close</button>
          <h1>Goals</h1>
       </section>

      </div>
    <script src="script.js"></script>
</body>
</html>
