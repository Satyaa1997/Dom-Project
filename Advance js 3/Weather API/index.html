<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-indigo-950 to-cyan-900 text-slate-100">
    <div class="mx-auto max-w-3xl px-4 py-10">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-semibold tracking-tight sm:text-5xl">Weather App</h1>
            <p class="mt-3 text-slate-300">Search any city for the latest weather update.</p>
        </header>

        <div class="rounded-[2rem] border border-white/10 bg-white/5 shadow-2xl shadow-slate-950/40 backdrop-blur-xl p-6 sm:p-8">
            <div class="grid gap-6">
                <div class="flex flex-col gap-4 sm:flex-row sm:items-center">
                    <input id="cityInput" type="text" placeholder="Search city name" class="flex-1 rounded-2xl border border-white/20 bg-slate-950/80 px-4 py-3 text-slate-100 placeholder:text-slate-500 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/30">
                    <button id="searchBtn" class="inline-flex items-center justify-center rounded-2xl bg-cyan-500 px-5 py-3 text-sm font-semibold text-slate-950 transition hover:bg-cyan-400">Search</button>
                </div>

                <div class="grid gap-6 lg:grid-cols-[220px_1fr]">
                    <div class="flex items-center justify-center rounded-3xl bg-cyan-500/10 p-6">
                        <img id="weatherIcon" src="" alt="Weather icon" class="h-28 w-28 object-contain">
                    </div>
                    <div class="grid gap-4 rounded-3xl bg-slate-950/70 p-6 text-slate-100">
                        <p id="cityName" class="text-lg font-semibold">City: --</p>
                        <p id="temperature" class="rounded-2xl bg-slate-900/80 p-4">Temperature: --</p>
                        <p id="windFlow" class="rounded-2xl bg-slate-900/80 p-4">Wind Flow: --</p>
                        <p id="sunrise" class="rounded-2xl bg-slate-900/80 p-4">Sunrise: --</p>
                        <p id="sunset" class="rounded-2xl bg-slate-900/80 p-4">Sunset: --</p>
                        <p id="humidity" class="rounded-2xl bg-slate-900/80 p-4">Humidity: --</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
